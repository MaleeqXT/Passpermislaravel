  <title id="title">Distance de sécurité</title><desc id="desc">Deux voitures sur une route avec une zone de distance de sécurité.</desc>
  <rect width="800" height="480" fill="#dff0ff"/><path d="M0 155h800v185H0z" fill="#53616c"/><path d="M0 247h800" stroke="#fff" stroke-width="8" stroke-dasharray="32 24"/>
  <g fill="#2e79c2"><rect x="95" y="203" width="130" height="60" rx="13"/><rect x="122" y="178" width="76" height="42" rx="10" fill="#aee4f7"/><circle cx="125" cy="272" r="16" fill="#1d2930"/><circle cx="195" cy="272" r="16" fill="#1d2930"/></g>
  <g fill="#d65950"><rect x="570" y="203" width="130" height="60" rx="13"/><rect x="597" y="178" width="76" height="42" rx="10" fill="#aee4f7"/><circle cx="600" cy="272" r="16" fill="#1d2930"/><circle cx="670" cy="272" r="16" fill="#1d2930"/></g>
