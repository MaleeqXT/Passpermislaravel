  <g stroke="#24333b" stroke-width="10" fill="none"><circle cx="620" cy="292" r="35"/><circle cx="705" cy="292" r="35"/><path d="M620 292l39-75 46 75m-46-75-42 0m42 0 14-43m-14 43-45-45"/></g><circle cx="671" cy="120" r="21" fill="#f3bd90"/><path d="M670 142l-16 72m16-60 31 30" stroke="#d85645" stroke-width="14" stroke-linecap="round"/>
